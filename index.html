<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Aniversário!</title>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(270deg, #ff9a9e, #fad0c4, #a1c4fd);
    background-size: 600% 600%;
    animation: gradientBG 15s ease infinite;
    text-align: center;
  }

  @keyframes gradientBG {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
  }

  h1 {
    margin-top: 50px;
    font-size: 3rem;
    color: #fff;
    text-shadow: 3px 3px #ff1493;
  }

  #mensagem {
    font-size: 1.5rem;
    margin-top: 20px;
    color: #fff;
    text-shadow: 1px 1px #ff1493;
  }

  .balao {
    position: absolute;
    font-size: 3rem;
    cursor: pointer;
    animation: subir linear infinite;
    user-select: none;
    transition: transform 0.2s;
  }

  .balao:hover {
    transform: scale(1.3);
  }

  @keyframes subir {
    0% { transform: translateY(100vh);}
    100% { transform: translateY(-200px);}
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 999;
  }
</style>
</head>
<body>

<h1>Feliz Aniversário, Max!</h1>
<p id="mensagem">Clique nos balões para a surpresa! 🎈</p>
<audio id="musica" src="musica_aniversario.mp3"></audio>
<canvas id="confete"></canvas>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
const canvas = document.getElementById('confete');
const confetti = window.confetti.create(canvas, { resize: true });
const musica = document.getElementById('musica');

// Cria um balão flutuante
function criarBalao() {
    const balao = document.createElement('div');
    balao.className = 'balao';
    const emojis = ['🎈','🎉','🎊','💖','🎂'];
    balao.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    balao.style.left = Math.random() * window.innerWidth + 'px';
    balao.style.animationDuration = (5 + Math.random() * 5) + 's';
    document.body.appendChild(balao);

    balao.addEventListener('click', () => {
        confetti({
            particleCount: 50,
            spread: 100,
            origin: { x: Math.random(), y: Math.random() * 0.5 }
        });
        musica.play();
        balao.remove();
        const msg = document.getElementById('mensagem');
        msg.textContent = "Você é incrível! 🎉";
        msg.style.transform = "scale(1.2)";
        setTimeout(()=> msg.style.transform = "scale(1)", 500);
    });
}

// Gera balões iniciais
for(let i=0;i<15;i++) criarBalao();

// Gera novos balões a cada 2 segundos
setInterval(criarBalao, 2000);
</script>

</body>
</html>
